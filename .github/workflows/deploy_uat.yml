# Deploys a release to UAT when its tag (v*) is pushed. Can be rerun by hand
# for an existing tag; branches are refused.

name: 'UAT Deploy'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/cloud_run_deploy.yml
    with:
      environment: uat
      deploy_env: uat
      release_only: true
    secrets: inherit
