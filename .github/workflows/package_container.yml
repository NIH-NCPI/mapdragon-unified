# Publishes a release image to ghcr.io for collaborators who deploy it on AWS
# within their own security boundary. Nothing is deployed to GCP. Run by hand
# for a release tag (pick it under "Use workflow from"); branches are refused.
#
# The front end is built with the alpha environment's VITE_CLIENT_ID, so the
# AWS deployment signs in through that OAuth client: its URL must be listed
# in that client's authorized JavaScript origins, and its GOOGLE_CLIENT_ID
# must be the same ID. See DEPLOYING.md.

name: 'Package Container'

on:
  workflow_dispatch:

env:
  GHCRIO_ORG: 'carrollaboratory'

jobs:
  package:
    runs-on: 'ubuntu-latest'

    environment:
      name: alpha

    permissions:
      contents: read

    steps:
      - name: 'Check what is being packaged'
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Only release tags are published. Pick a tag under 'Use workflow from', not the branch $GITHUB_REF_NAME."
            exit 1
          fi
          if [ -z "${{ vars.VITE_CLIENT_ID }}" ] || [ -z "${{ vars.IMAGE_NAME }}" ]; then
            echo "::error::VITE_CLIENT_ID and IMAGE_NAME must be set for the alpha environment (or the repository)."
            exit 1
          fi
          echo "GHCR_TAG=ghcr.io/$GHCRIO_ORG/${{ vars.IMAGE_NAME }}:$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Build Container'
        run: |
          docker build --tag "$GHCR_TAG" \
              --build-arg VITE_CLIENT_ID="${{ vars.VITE_CLIENT_ID }}" \
              --build-arg DEPLOY_ENV=aws \
              .

      - name: 'Log in to GitHub Container Registry'
        run: echo "${{ secrets.GHRCIO_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: 'Push to GitHub Container Registry'
        run: docker push "$GHCR_TAG"
