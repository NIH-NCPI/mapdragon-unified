# Deploys main to dev on every merge, so dev always shows what's on main.
# To try a branch on dev before merging, run this by hand and pick the branch
# under "Use workflow from". The next merge to main puts dev back.

name: 'Dev Deploy'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/cloud_run_deploy.yml
    with:
      environment: dev
      deploy_env: dev
    secrets: inherit
