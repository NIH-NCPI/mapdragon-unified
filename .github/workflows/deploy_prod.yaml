# Promotes a release to prod (the "alpha" environment). Run by hand once the
# release has been checked on UAT: Actions > Prod Deploy > Run workflow, and
# pick the release tag under "Use workflow from". Branches are refused.
# Required reviewers on the alpha environment approve the run.

name: 'Prod Deploy'

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/cloud_run_deploy.yml
    with:
      environment: alpha
      deploy_env: prod
      release_only: true
    secrets: inherit
