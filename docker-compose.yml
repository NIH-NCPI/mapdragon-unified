# Local test harness for the unified Map Dragon image.
#
# This builds the *same* Dockerfile that the GCP (Cloud Run) and AWS
# deployments use, so what you test here is what ships. The only thing that
# differs between environments is runtime configuration (MONGO_URI, etc.).
#
# Quick start:
#   cp .env.example .env        # then fill in UMLS_API_KEY / VITE_CLIENT_ID
#   docker compose up --build
#   open http://localhost:8080  (API: http://localhost:8080/api/version)
#
# Test the image against a remote database (Firestore Mongo-compat, DocumentDB):
#   set MONGO_URI in .env, then
#   docker compose up --build --no-deps app
#
# See README.md ("Local testing with Docker Compose") for details.

name: mapdragon-unified

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Args listed without a value are only passed when set in your shell or
      # .env; otherwise the Dockerfile defaults (pinned commits) are used.
      args:
        - VITE_CLIENT_ID
        - MAPDRAGON_COMMIT
        - VITE_MAPDRAGON_VERSION
        - LOCUTUS_COMMIT
        - DEPLOY_ENV=${DEPLOY_ENV:-local}
    # Cloud Run and AWS both run linux/amd64. Building for the same platform
    # keeps local tests faithful (slower on Apple Silicon due to emulation).
    # Set DOCKER_PLATFORM=linux/arm64 in .env for faster native builds.
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: mapdragon-unified:${IMAGE_TAG:-local}
    ports:
      # The container always listens on 8080 (matches Cloud Run / AWS).
      - "${APP_PORT:-8080}:8080"
    environment:
      LOCUTUS_DB_TYPE: mongodb
      # Defaults to the bundled mongo service. Override in .env to point at a
      # remote database.
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_ROOT_USER:-locutus}:${MONGO_ROOT_PASSWORD:-locutus}@mongo:27017/${MONGO_DB_NAME:-locutus}?authSource=admin}
      UMLS_API_KEY: ${UMLS_API_KEY:?Set UMLS_API_KEY in .env (see .env.example)}
      VERSION: ${VERSION:-local}
      LOCUTUS_LOGLEVEL: ${LOCUTUS_LOGLEVEL:-INFO}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the python:alpine base image
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Startup downloads an ontology lookup CSV before serving requests.
      start_period: 60s

  mongo:
    # Pinned major version; Firestore Mongo-compat and DocumentDB both
    # implement a subset of the MongoDB API, so avoid relying on
    # newest-version features locally.
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-locutus}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-locutus}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-locutus}
    ports:
      # Bound to localhost only so you can inspect/seed it (mongosh, Compass)
      # without exposing it to your network.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
