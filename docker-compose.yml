# Local test harness for the unified Map Dragon image.
#
# This builds the *same* Dockerfile that the GCP (Cloud Run) and AWS
# deployments use, so what you test here is what ships. The only thing that
# differs between environments is runtime configuration (MONGO_URI, etc.).
#
# Quick start:
#   cp .env.example .env        # then fill in UMLS_API_KEY / VITE_CLIENT_ID
#   docker compose up --build
#   open http://localhost:8080  (API: http://localhost:8080/api/version)
#
# Test the image against a remote database (Firestore Mongo-compat, DocumentDB):
#   set MONGO_URI in .env, then
#   docker compose up --build --no-deps app
#
# Seed the database (institutions, admin emails, terminologies) from
# ./config.yaml using locutils:
#   docker compose run --rm seed             # bundled mongo service
#   docker compose run --rm --no-deps seed   # remote MONGO_URI from .env
#
# Copy a database to a file and back (dumps land in ./backups, which is
# git-ignored because dumps hold real user emails):
#   docker compose run --rm locutils dump -o backups/local.locutus.json.gz
#   docker compose run --rm locutils load -i backups/local.locutus.json.gz --replace
#   docker compose run --rm locutils-remote dump -o backups/dev.locutus.json.gz
# The justfile wraps these (just db-dump, db-dump-remote, db-load) and can
# start the stack from a dump (TEST_DUMP in .env).
#
# See README.md ("Local testing with Docker Compose") for details.

name: mapdragon-unified

x-mongo-uri: &mongo-uri ${MONGO_URI:-mongodb://${MONGO_ROOT_USER:-locutus}:${MONGO_ROOT_PASSWORD:-locutus}@mongo:27017/${MONGO_DB_NAME:-locutus}?authSource=admin}

# The bundled mongo service, regardless of MONGO_URI.
x-local-mongo-uri: &local-mongo-uri mongodb://${MONGO_ROOT_USER:-locutus}:${MONGO_ROOT_PASSWORD:-locutus}@mongo:27017/${MONGO_DB_NAME:-locutus}?authSource=admin

# Where uvx installs locutils from. Point it at a branch to try unreleased
# changes, e.g. git+https://github.com/carrollaboratory/locutus-utils@my-branch
x-locutils-spec: &locutils-spec ${LOCUTILS_SPEC:-git+https://github.com/carrollaboratory/locutus-utils}

# Shared by the locutils services: runs `locutils <args>` and hands any
# dumps it wrote back to the host user (HOST_UID/HOST_GID, set by the
# justfile) so they aren't left owned by root.
x-locutils: &locutils
  profiles: ["tools"]
  # Full (non-slim) image so git is available for the git+https installs.
  image: ghcr.io/astral-sh/uv:python3.13-bookworm
  working_dir: /work
  volumes:
    - ./config.yaml:/work/config.yaml:ro
    - ./backups:/work/backups
    - uv-cache:/uv-cache
  entrypoint:
    - sh
    - -c
    - |
      if [ -z "$$MONGO_URI" ]; then
        echo "error: no database URI. Set SOURCE_MONGO_URI (or MONGO_URI) in .env." >&2
        exit 2
      fi
      # DocumentDB URIs reference the RDS CA bundle (see .env.example)
      case "$$MONGO_URI" in
        *global-bundle.pem*) [ -f /global-bundle.pem ] ||
          curl -fsSL -o /global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem ;;
      esac
      uvx --from "$$LOCUTILS_SPEC" locutils "$$@"
      status=$$?
      if [ -n "$$HOST_UID" ] && [ -d backups ]; then
        chown -R "$$HOST_UID:$${HOST_GID:-$$HOST_UID}" backups
      fi
      exit $$status
    - locutils

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Args listed without a value are only passed when set in your shell or
      # .env; otherwise the Dockerfile defaults (pinned commits) are used.
      args:
        - VITE_CLIENT_ID
        - MAPDRAGON_COMMIT
        - VITE_MAPDRAGON_VERSION
        - LOCUTUS_COMMIT
        - DEPLOY_ENV=${DEPLOY_ENV:-local}
    # Cloud Run and AWS both run linux/amd64. Building for the same platform
    # keeps local tests faithful (slower on Apple Silicon due to emulation).
    # Set DOCKER_PLATFORM=linux/arm64 in .env for faster native builds.
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: mapdragon-unified:${IMAGE_TAG:-local}
    ports:
      # The container always listens on 8080 (matches Cloud Run / AWS).
      - "${APP_PORT:-8080}:8080"
    environment:
      LOCUTUS_DB_TYPE: mongodb
      # Defaults to the bundled mongo service. Override in .env to point at a
      # remote database.
      MONGO_URI: *mongo-uri
      UMLS_API_KEY: ${UMLS_API_KEY:?Set UMLS_API_KEY in .env (see .env.example)}
      # Back end verifies Google sign-in tokens against the same OAuth client
      # the front end is built with.
      GOOGLE_CLIENT_ID: ${VITE_CLIENT_ID}
      VERSION: ${VERSION:-local}
      LOCUTUS_LOGLEVEL: ${LOCUTUS_LOGLEVEL:-INFO}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the python:alpine base image
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Startup downloads an ontology lookup CSV before serving requests.
      start_period: 60s

  # One-shot job that seeds the database from ./config.yaml. It sits behind
  # the "seed" profile so a plain `docker compose up` doesn't rerun it; use
  # `docker compose run --rm seed` (see top of file).
  seed:
    profiles: ["seed"]
    # Full (non-slim) image so git is available for the git+https installs.
    image: ghcr.io/astral-sh/uv:python3.13-bookworm
    working_dir: /work
    environment:
      MONGO_URI: *mongo-uri
      LOCUTILS_SPEC: *locutils-spec
      UV_CACHE_DIR: /uv-cache
    volumes:
      - ./config.yaml:/work/config.yaml:ro
      - uv-cache:/uv-cache
    command:
      - sh
      - -c
      - >-
        uvx --from "$$LOCUTILS_SPEC"
        locutils --config ./config.yaml --institutions -a seed -o include
        -db "$$MONGO_URI"
    depends_on:
      mongo:
        condition: service_healthy

  # locutils against the bundled mongo service (dump, load, seed with
  # custom flags). Arguments go straight to locutils.
  locutils:
    <<: *locutils
    environment:
      MONGO_URI: *local-mongo-uri
      LOCUTILS_SPEC: *locutils-spec
      UV_CACHE_DIR: /uv-cache
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
    depends_on:
      mongo:
        condition: service_healthy

  # locutils against a remote database: SOURCE_MONGO_URI, else MONGO_URI.
  locutils-remote:
    <<: *locutils
    environment:
      MONGO_URI: ${SOURCE_MONGO_URI:-${MONGO_URI:-}}
      LOCUTILS_SPEC: *locutils-spec
      UV_CACHE_DIR: /uv-cache
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
    # For DocumentDB tunnels on Linux (host.docker.internal)
    extra_hosts:
      - host.docker.internal:host-gateway

  mongo:
    # Pinned major version; Firestore Mongo-compat and DocumentDB both
    # implement a subset of the MongoDB API, so avoid relying on
    # newest-version features locally.
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-locutus}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-locutus}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-locutus}
    ports:
      # Bound to localhost only so you can inspect/seed it (mongosh, Compass)
      # without exposing it to your network.
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
  uv-cache:
